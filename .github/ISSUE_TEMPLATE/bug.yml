name: Bug
description: Reportar un error encontrado en el MVP
title: "[BUG][CUxx] "
labels: ["tipo:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Todo bug lleva módulo, CU afectado y criticidad, porque de ahí sale la métrica MTR-IP03.
        Quien registra el bug (QA) agrega a mano las etiquetas `modulo:Mx` y `criticidad:...` según lo que se elija abajo.

  - type: dropdown
    id: modulo
    attributes:
      label: Módulo
      options:
        - M1 - Autenticación y registro de clientes
        - M2 - Consulta y edición de clientes
        - M3 - Registro y consulta de ventas
        - M4 - Dashboard básico
        - Infraestructura
    validations:
      required: true

  - type: input
    id: cu
    attributes:
      label: Caso de uso afectado
      description: Código del CU y número de su Issue.
      placeholder: CU03 (#12)
    validations:
      required: true

  - type: dropdown
    id: criticidad
    attributes:
      label: Criticidad
      description: Una criticidad alta pasa el CU a "Con incidencia" y bloquea el cierre del módulo.
      options:
        - Alta - impide usar una funcionalidad, pierde datos o compromete la seguridad del login
        - Media - la funcionalidad opera con errores, pero existe una alternativa
        - Baja - error de presentación o de texto que no afecta la operación
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir el formulario de registro de cliente.
        2. Escribir un RUC que ya existe.
        3. Pulsar Guardar.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
      placeholder: El sistema avisa que el RUC ya existe y no guarda.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
      placeholder: El sistema guarda un segundo cliente con el mismo RUC.
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Dónde lo viste.
      placeholder: Local, rama main, Chrome
    validations:
      required: false

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas o mensajes de error. Nunca pegues claves ni contenido de `.env`.
    validations:
      required: false